<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Grid lines -->
  <line x1="24" y1="44" x2="104" y2="44" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="24" y1="64" x2="104" y2="64" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="24" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Streaming token wave -->
  <path d="M 22 64 L 42 64 L 50 36 L 58 92 L 66 52 L 72 74 L 78 64 L 106 64" fill="none" stroke="url(#streamGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Magnifying Lens Ring -->
  <circle cx="62" cy="62" r="26" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9" filter="url(#glow)" />
  <circle cx="62" cy="62" r="23" fill="#0f172a" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Lens Handle -->
  <line x1="81" y1="81" x2="100" y2="100" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />

  <!-- Center Pulse Dot -->
  <circle cx="62" cy="62" r="3" fill="#10b981" filter="url(#glow)" />
</svg>
